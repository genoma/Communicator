name: CI

on:
  push:
    branches: [main]
    # Release tags are bare versions (3.47.6); the legacy v-prefixed series is
    # kept so re-running an old tag still works.
    tags: ['[0-9]*', 'v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
